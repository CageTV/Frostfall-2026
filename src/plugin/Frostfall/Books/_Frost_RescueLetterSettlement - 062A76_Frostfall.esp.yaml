  Value: >-
    <font face="$HandwrittenFont">I happened upon your shivering frame while riding on horseback. My business was urgent, so although I could not take you to the nearest village, I thought it best to take you with me. If the gods see fit for you to rise another day, then I hope that you will remember to help someone else in their own time of need.


    May fortune smile upon you.
