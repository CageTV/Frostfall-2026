  Value: >-
    Player Hand-Warming Animations


    Off: You will never warm your hands.

    Auto: You will automatically begin warming your hands when facing a fire. Must be standing in 3rd person mode with weapons sheathed.

    Prompt: You will be prompted to warm your hands when facing fires, even in 1st person mode. Must be standing with weapons sheathed.


    Current setting: Prompt
