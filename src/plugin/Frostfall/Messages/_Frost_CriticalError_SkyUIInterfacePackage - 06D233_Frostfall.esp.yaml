  Value: >-
    Frostfall Error - SkyUI Add-on Mismatch


    The version of SkyUI and the version of Frostfall SkyUI Add-on do not match. This will cause SkyUI to have serious problems. Please ensure that the version of the Frostfall SkyUI Add-on you installed matches the version of SkyUI you are using.


    Expected SkyUI Version: %.0f.x


    This message will repeat. DO NOT SAVE YOUR GAME, exit now and check your installation.
