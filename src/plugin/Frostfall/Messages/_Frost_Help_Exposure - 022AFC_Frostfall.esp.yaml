Description:
  TargetLanguage: English
  Value: >-
    EXPOSURE


    Your exposure has increased, and your skills are beginning to suffer. You should find a fire to warm up.


    Increasing your total Warmth (by wearing warm armor) can reduce your rate of exposure.


    At very high exposure, you will pass out and awaken elsewhere by default.
