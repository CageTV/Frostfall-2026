    Waiting while Outdoors


    Whether or not to enable the ability to wait while outdoors. If disabled, you can still wait when indoors. It may take up to 5 seconds for this setting to take effect after you change it. 


    WARNING: Disabling waiting outdoors will also disable Fast Travel.


    Current setting: Disabled
