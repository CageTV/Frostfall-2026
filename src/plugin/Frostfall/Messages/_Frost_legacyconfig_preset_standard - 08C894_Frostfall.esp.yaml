Description:
  TargetLanguage: English
  Value: >-
    Ice and Valor


    This is the default preset. You must plan ahead, wear warm clothing and armor, and set up camp when necessary.


    The exposure rate is normal (1.0x)

    At max exposure, you will pass out and awaken elsewhere.

    Fast travel is enabled.

    Frigid water is lethal.

    Exposure is paused during combat.

    You will move slowly at high exposure.
